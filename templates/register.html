<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - CTF Enquête Criminelle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Special Elite', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("{{ url_for('static', filename='images/police-background.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .auth-container {
            background: rgba(20, 20, 20, 0.95);
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        h1 {
            color: #cc0000;
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            font-family: 'Special Elite', cursive;
            box-sizing: border-box;
        }

        .error-message {
            color: #ff5555;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .submit-btn {
            background: #cc0000;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            font-family: 'Special Elite', cursive;
            width: 100%;
            font-size: 1.1em;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #990000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.5);
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link {
            color: #cc0000;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .auth-link:hover {
            color: #ff0000;
            text-decoration: underline;
        }

        .flash-messages {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .flash-message {
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
        }

        .flash-message.success {
            background: #004400;
            color: #ffffff;
            border-left: 4px solid #00aa00;
        }

        .flash-message.error {
            background: #440000;
            color: #ffffff;
            border-left: 4px solid #aa0000;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Inscription Agent</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for category, message in messages %}
                        <li class="flash-message {{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Nom d'agent</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="submit-btn">CRÉER MON COMPTE</button>
        </form>

        <div class="auth-links">
            <p>Déjà un compte? <a href="{{ url_for('login') }}" class="auth-link">Connexion</a></p>
        </div>
    </div>
</body>
</html>
