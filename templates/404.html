<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Refusé - CTF Enquête Criminelle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Special Elite', cursive;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("{{ url_for('static', filename='images/police-background.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .error-container {
            background: rgba(20, 20, 20, 0.95);
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            text-align: center;
        }

        .error-stamp {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #cc0000;
            color: white;
            padding: 5px 15px;
            transform: rotate(15deg);
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #cc0000;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .police-tape {
            background: repeating-linear-gradient(
                45deg,
                #f8d000,
                #f8d000 10px,
                #000000 10px,
                #000000 20px
            );
            height: 30px;
            width: 100%;
            margin: 30px 0;
        }

        .error-message {
            font-size: 1.2em;
            margin: 20px 0;
            line-height: 1.5;
        }

        .back-btn {
            background: #cc0000;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-family: 'Special Elite', cursive;
            font-size: 1.1em;
            margin-top: 20px;
            display: inline-block;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #990000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-stamp">ACCÈS REFUSÉ</div>
        <h1>404 - Page Non Trouvée</h1>

        <div class="police-tape"></div>

        <div class="error-message">
            <p>Le dossier que vous recherchez n'existe pas ou a été classifié.</p>
            <p>Vérifiez vos accréditations et réessayez.</p>
        </div>

        <a href="{{ url_for('home') }}" class="back-btn">RETOUR AU QG</a>
    </div>
</body>
</html>
